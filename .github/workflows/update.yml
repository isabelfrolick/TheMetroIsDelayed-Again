name: Update data and deploy

on:
  schedule:
    - cron: "0 11 * * 1"          # Mondays 11:00 UTC (7:00 in Montréal, summer time)
  workflow_dispatch:               # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Reprocess even if the STM file has not changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]   # redeploy when you edit the front end

permissions:
  contents: write     # commit refreshed data back to the repo
  pages: write        # deploy to GitHub Pages
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build métro line geometry (only if missing)
        if: hashFiles('data/geo/metro_lines.geojson') == ''
        run: python pipeline/fetch.py --geo

      - name: Fetch STM incidents
        id: fetch
        run: python pipeline/fetch.py ${{ inputs.force && '--force' || '' }}

      - name: Process
        if: steps.fetch.outputs.changed == 'true'
        run: python pipeline/process.py

      - name: Validate
        if: steps.fetch.outputs.changed == 'true'
        run: python pipeline/validate.py

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            THROUGH=$(jq -r '.data_through // "n/a"' site/data/meta.json 2>/dev/null || echo n/a)
            git commit -m "data: STM incidents refresh (data through ${THROUGH})"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-data
    # Deploy after a data commit, on manual runs, and on front-end pushes (update-data is skipped then)
    if: >-
      always() &&
      (needs.update-data.result == 'success' || needs.update-data.result == 'skipped') &&
      (needs.update-data.outputs.committed == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # pick up the data commit made by the previous job

      - name: Copy line geometry into the site
        run: |
          mkdir -p site/data
          if [ -f data/geo/metro_lines.geojson ]; then cp data/geo/metro_lines.geojson site/data/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
